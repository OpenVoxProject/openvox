---
name: RSpec tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUNDLE_SET: "without packaging documentation release"

concurrency:
  group: rspec-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_manpages:
    name: Validate man pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `man` exits 0 even when groff reports problems, so treat any stderr
      # output as a failure. Unlike the equivalent check in openfact, this only
      # inspects stderr (some pages legitimately contain the word "warning")
      # and uses a wide MANWIDTH (some pages contain unbreakable tokens longer
      # than 80 columns, such as long URLs and the `ciphers` default value,
      # which trigger unfixable "cannot break line" warnings at narrower widths).
      - name: Validate man pages with groff
        run: |
          status=0
          for f in man/man5/*.5 man/man8/*.8; do
            errors=$(LC_ALL=C.UTF-8 MANROFFSEQ='' MANWIDTH=1000 man --warnings -E UTF-8 -l -Tutf8 -Z "$f" 2>&1 >/dev/null)
            if [ -n "$errors" ]; then
              echo "$f:"
              echo "$errors"
              status=1
            fi
          done
          exit $status

  checks:
    name: ${{ matrix.cfg.check }}
    strategy:
      matrix:
        cfg:
          - {check: rubocop, os: ubuntu-latest, ruby: '3.3'}
          - {check: warnings, os: ubuntu-latest, ruby: '3.3'}

    runs-on: ${{ matrix.cfg.os }}
    steps:
      - name: Checkout current PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ruby version ${{ matrix.cfg.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.cfg.ruby }}
          bundler-cache: true

      - name: Run ${{ matrix.cfg.check }} check
        run: bundle exec rake ${{ matrix.cfg.check }}

  rspec_tests:
    name: ${{ matrix.cfg.os }}(ruby ${{ matrix.cfg.ruby }})
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - {os: ubuntu-24.04, ruby: '3.2'}
          - {os: ubuntu-24.04, ruby: '3.3'}
          - {os: ubuntu-24.04, ruby: '3.4'}
          - {os: ubuntu-24.04, ruby: '4.0'}
          - {os: ubuntu-24.04, ruby: 'jruby-10.0.6.0'}
          - {os: ubuntu-24.04, ruby: 'jruby-10.1.1.0'}
          - {os: windows-2025, ruby: '3.2'}
          - {os: windows-2025, ruby: '3.3'}
          - {os: windows-2025, ruby: '3.4'}
          - {os: windows-2025, ruby: '4.0'}

    runs-on: ${{ matrix.cfg.os }}
    steps:
      - name: Checkout current PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ruby version ${{ matrix.cfg.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.cfg.ruby }}
          bundler-cache: true

      - name: Output Ruby Environment
        run: bundle env

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: |
          # Exclude the workspace and temp dirs from Windows Defender realtime
          # scanning; the specs create thousands of short-lived tmpfiles and
          # scanning each one slows the suite considerably.
          Add-MpPreference -ExclusionPath $Env:GITHUB_WORKSPACE, $Env:RUNNER_TEMP

          # https://github.com/ruby/ruby/pull/2791/files#diff-ff5ff976e81bebd977f0834e60416abbR97-R100
          # Actions uses UTF8, causes test failures, similar to normal OS setup
          $PSDefaultParameterValues['*:Encoding'] = 'utf8'
          [Console]::OutputEncoding = [System.Text.Encoding]::GetEncoding("IBM437")
          [Console]::InputEncoding  = [System.Text.Encoding]::GetEncoding("IBM437")
          $Env:LOG_SPEC_ORDER = 'true'

          # debug information
          chcp
          Get-WinSystemLocale
          Get-ChildItem Env: | % { Write-Output "$($_.Key): $($_.Value)"  }
          # Enable Windows filesystem 8.3 support, see https://github.com/OpenVoxProject/openvox/pull/180
          reg add HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem /t REG_DWORD /v NtfsDisable8dot3NameCreation /d 0 /f
          # list current OpenSSL install
          gem list openssl
          ruby -ropenssl -e 'puts "OpenSSL Version - #{OpenSSL::OPENSSL_VERSION}"; puts "OpenSSL Library Version - #{OpenSSL::OPENSSL_LIBRARY_VERSION}"'

          # Run tests
          # Note: keep the default spec grouping here. Consolidating groups
          # changes which specs share a process, and the Windows registry
          # integration specs are order/state sensitive (14 failures in
          # spec/integration/util/windows/registry_spec.rb when run in
          # larger groups).
          bundle exec rake parallel:spec

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: |
          # debug information
          ruby -ropenssl -e 'puts "OpenSSL Version - #{OpenSSL::OPENSSL_VERSION}"; puts "OpenSSL Library Version - #{OpenSSL::OPENSSL_LIBRARY_VERSION}"'

          if [[ ${{ matrix.cfg.ruby }} =~ "jruby" ]]; then
            export _JAVA_OPTIONS='-Xmx1024m -Xms512m'

            # Favor fast startup over peak JIT optimization: the suite runs in
            # many short-lived processes, so cold-JIT time dominates. Note the
            # trade-off: less-optimized JIT could in principle behave
            # differently, but these jobs exist to test openvox under JRuby,
            # not to exercise JRuby's optimizer.
            export JRUBY_OPTS='--dev'

            # workaround for PUP-10683
            sudo apt remove rpm

            # Larger spec groups mean fewer JVM boots (23 -> ~4), each of
            # which costs startup plus ~19s of requires.
            bundle exec rake "parallel:spec[$(nproc),6000]"
          else
            bundle exec rake parallel:spec
          fi

  rake_checks:
    name: AIO Package Rake Checks
    runs-on: ubuntu-24.04
    steps:
      # needs fetch-depth because the packaging dem reads old git tags
      - name: Checkout current PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Ruby version 3.3
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Validate code
        run: |
          bundle exec rake rubocop
          bundle exec rake -T | grep vox:build
          bundle exec rake -T | grep vox:upload
        working-directory: packaging

  test_gem_build:
    name: Test gem build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Build gem for all platforms
        run: bundle exec rake ci:gem_build

      - name: Upload gem to GitHub cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-artifact
          path: '*.gem'
          retention-days: 1
          compression-level: 0

  test_install:
    name: Test gem install
    needs: test_gem_build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            gem-platform: ruby
          - os: macos-15
            gem-platform: universal-darwin
          - os: windows-2025
            gem-platform: x64-mingw-ucrt
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download gem from GitHub cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-artifact

      - name: Determine gem file
        id: gem
        shell: bash
        env:
          GEM_PLATFORM: ${{ matrix.gem-platform }}
        run: |
          gem_file="$(
            ruby -rrubygems -e '
              spec = Gem::Specification.load("openvox.gemspec")
              abort "Could not load openvox.gemspec" unless spec
              spec.platform = ENV.fetch("GEM_PLATFORM") unless ENV["GEM_PLATFORM"] == "ruby"
              puts spec.file_name
            '
          )"

          test -f "$gem_file"
          echo "file=$gem_file" >> "$GITHUB_OUTPUT"

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Install gem
        run: gem install "${{ steps.gem.outputs.file }}" --verbose

      - name: Smoke test
        shell: bash
        run: |
          puppet --version
          ruby -rpuppet -e 'puts Puppet.version'

  tests:
    if: always()
    needs:
      - checks
      - rake_checks
      - rspec_tests
      - test_gem_build
      - test_install
      - validate_manpages
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
