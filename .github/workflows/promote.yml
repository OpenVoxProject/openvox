name: Promote Component

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component name to promote'
        required: true
        type: string
      ref:
        description: 'Git ref/tag to promote. For puppet-runtime, use the tag that has been built and uploaded to openvox-artifacts.'
        required: true
        type: string
      branch:
        description: 'Branch to promote to (defaults to main)'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - '8.x'

permissions: {}

jobs:
  promote:
    uses: OpenVoxProject/shared-actions/.github/workflows/promote.yml@main
    with:
      component: ${{ inputs.component }}
      ref: ${{ inputs.ref }}
      branch: ${{ inputs.branch }}
      validate_command: bundle exec vanagon render openvox-agent el-10-x86_64
      validate_working_directory: packaging/
    secrets:
      github_pat: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
      ssh_private_key: ${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}
