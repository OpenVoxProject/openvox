name: Promote Component

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component name to promote'
        required: true
        type: string
      ref:
        description: 'Git ref/tag to promote. For puppet-runtime, use the tag that has been built and uploaded to openvox-artifacts.'
        required: true
        type: string
      branch:
        description: 'Branch to promote to (defaults to main)'
        required: false
        default: 'main'
        type: string

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
          fetch-depth: 0 # required for vanagon below to determine the openvox version

      - name: Setup git and SSH signing
        id: git_identity
        uses: OpenVoxProject/shared-actions/.github/actions/setup-git-ssh-signing@main
        with:
          ssh_private_key: ${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}

      - name: Validate component exists
        run: |
          component="${{ inputs.component }}"
          if [[ ! -f "packaging/configs/components/${component}.json" ]]; then
            echo "::error::Could not find packaging/configs/components/${component}.json"
            exit 1
          fi

      - name: Generate component JSON
        id: generate
        run: |
          component="${{ inputs.component }}"
          ref="${{ inputs.ref }}"

          if [[ "${component}" =~ ^(puppet-runtime|openssl-fips)$ ]]; then
            # Munge the ref: replace - with .
            munged="${ref//-/.}"
            json="{\"location\":\"https://s3.osuosl.org/openvox-artifacts/${component}/${ref}/\",\"version\":\"${munged}\"}"
          else
            json="{\"url\":\"https://github.com/openvoxproject/${component}.git\",\"ref\":\"${ref}\"}"
          fi

          echo "json=${json}" >> "$GITHUB_OUTPUT"
          echo "Generated JSON: ${json}"

      - name: Write component JSON
        run: |
          component="${{ inputs.component }}"
          echo '${{ steps.generate.outputs.json }}' > "packaging/configs/components/${component}.json"
          echo "Wrote packaging/configs/components/${component}.json:"
          cat "packaging/configs/components/${component}.json"
      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true
      # downloads all required components and fails if one isn't available
      # basically ensures our inputs.ref doesn't contain typos
      - name: Validate Vanagon render
        working-directory: packaging/
        run: bundle exec vanagon render openvox-agent el-10-x86_64

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Promote ${{ inputs.component }} ${{ inputs.ref }} into ${{ inputs.branch }}"
          branch: "promote/${{ inputs.branch }}/${{ inputs.component }}/${{ inputs.ref }}"
          delete-branch: true
          title: "Promote ${{ inputs.component }} ${{ inputs.ref }} into ${{ inputs.branch }}"
          token: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
          assignees: '${{ github.triggering_actor }}'
          author: '${{ steps.git_identity.outputs.git_author_name }} <${{ steps.git_identity.outputs.git_author_email }}>'
          committer: '${{ steps.git_identity.outputs.git_committer_name }} <${{ steps.git_identity.outputs.git_committer_email }}>'
          signoff: true
          base: ${{ inputs.branch }}
          body: |
            Automated promotion of ${{ inputs.component }} to ref ${{ inputs.ref }} in ${{ inputs.branch }}.
